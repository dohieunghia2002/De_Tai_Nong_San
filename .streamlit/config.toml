# Streamlit settings for the progress demo (demo/app.py), read when it is started from the repo root.

[browser]
# do not send usage statistics to Streamlit's servers
gatherUsageStats = false

[server]
# the browser opens by itself (headless = false). On a machine without ~/.streamlit/credentials.toml, Streamlit asks
# once for an e-mail in the terminal: press Enter to skip it.
headless = false
# serve this machine only; a specific address also stops Streamlit from looking up the public IP
# (checkip.amazonaws.com) to print an "External URL"
address = "localhost"

[theme]
# the figures are drawn on white
base = "light"

[theme.sidebar]
# Streamlit 1.65 leaves these empty when only `base` is set and the browser console then warns "Invalid color
# passed for primaryColor in theme.sidebar" on every rerun: the values of the light theme, written out
primaryColor = "#ff4b4b"
textColor = "#31333f"
