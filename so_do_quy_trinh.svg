<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1100" width="1030" height="1100" font-family="Segoe UI, Arial, sans-serif">
        <rect x="0" y="0" width="1030" height="1100" fill="#ffffff"/>
        <defs>
          <marker id="mk-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6762"/></marker>
          <marker id="mk-bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#985912"/></marker>
          <marker id="mk-op" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d6c62"/></marker>
        </defs>

        <!-- lane backgrounds -->
        <rect x="40" y="14" width="540" height="1046" rx="12" fill="#e2f0ed" opacity=".55"/>
        <rect x="660" y="14" width="340" height="836" rx="12" fill="#f5ebde" opacity=".55"/>

        <!-- lane labels -->
        <text x="50" y="40" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="1.2" font-weight="600" fill="#0d6c62">VẬN HÀNH THỜI GIAN THỰC</text>
        <text x="50" y="60" font-size="11" fill="#5a6762">mỗi mốc 24 giờ, từ giờ thứ 96 đến giờ thứ 216</text>
        <text x="670" y="40" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="1.2" font-weight="600" fill="#985912">XÂY DỰNG VÀ KIỂM ĐỊNH</text>
        <text x="670" y="60" font-size="11" fill="#5a6762">trên bản sao số, trước khi đưa vào vận hành</text>

        <!-- inputs -->
        <rect x="50" y="76" width="166" height="134" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#5a6762" stroke-dasharray="4 3"/>
        <text x="62" y="100" font-size="13.5" font-weight="600" fill="#17201d">Cảm biến trực tuyến</text>
        <text x="62" y="118" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5a6762">12 phút/lần</text>
        <text x="62" y="142" font-size="12" fill="#17201d">thể tích, khối lượng,</text>
        <text x="62" y="158" font-size="12" fill="#17201d">nhiệt độ, pH,</text>
        <text x="62" y="174" font-size="12" fill="#17201d">oxy hòa tan,</text>
        <text x="62" y="190" font-size="12" fill="#17201d">oxy và CO₂ khí thải</text>

        <rect x="227" y="76" width="166" height="134" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#5a6762" stroke-dasharray="4 3"/>
        <text x="239" y="100" font-size="13.5" font-weight="600" fill="#17201d">Phòng thí nghiệm</text>
        <text x="239" y="118" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5a6762">12 giờ/lần, trễ 4 giờ</text>
        <text x="239" y="142" font-size="12" fill="#17201d">penicillin, sinh khối,</text>
        <text x="239" y="158" font-size="12" fill="#17201d">tiền chất, amoniac,</text>
        <text x="239" y="174" font-size="12" fill="#17201d">độ nhớt</text>

        <rect x="404" y="76" width="166" height="134" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#5a6762" stroke-dasharray="4 3"/>
        <text x="416" y="100" font-size="13.5" font-weight="600" fill="#17201d">Công thức vận hành</text>
        <text x="416" y="118" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5a6762">lượng nạp theo giờ</text>
        <text x="416" y="142" font-size="12" fill="#17201d">đường, dầu, khí sục,</text>
        <text x="416" y="158" font-size="12" fill="#17201d">tiền chất,</text>
        <text x="416" y="174" font-size="12" fill="#17201d">lịch xả dịch</text>

        <line x1="133" y1="210" x2="133" y2="247" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>
        <line x1="310" y1="210" x2="310" y2="247" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>
        <line x1="487" y1="210" x2="487" y2="247" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>

        <!-- 1 -->
        <rect x="50" y="250" width="520" height="58" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#0d6c62"/>
        <text x="66" y="274" font-size="13.5" font-weight="600" fill="#17201d">1. Trích xuất trạng thái</text>
        <text x="66" y="294" font-size="12" fill="#17201d">18 đại lượng mà nhà máy đo được tại thời điểm quyết định</text>
        <line x1="310" y1="308" x2="310" y2="345" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>
        <text x="322" y="331" font-size="11" fill="#5a6762">trạng thái của mẻ</text>

        <!-- 2 -->
        <rect x="50" y="348" width="520" height="94" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#0d6c62"/>
        <text x="66" y="372" font-size="13.5" font-weight="600" fill="#17201d">2. Đánh giá 1.296 phương án hành động</text>
        <text x="66" y="394" font-size="12" fill="#17201d">nhân lượng đường, dầu, khí sục, tiền chất với hệ số 0,6 đến 1,6</text>
        <text x="66" y="412" font-size="12" fill="#17201d">mô hình dự báo penicillin thu thêm và thể tích lớn nhất sau 24 giờ</text>
        <text x="66" y="430" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5a6762">so sánh với giữ nguyên công thức</text>
        <line x1="310" y1="442" x2="310" y2="483" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>
        <text x="322" y="467" font-size="11" fill="#5a6762">lợi ích và thể tích dự báo</text>

        <!-- 3 -->
        <rect x="50" y="486" width="520" height="58" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#0d6c62"/>
        <text x="66" y="510" font-size="13.5" font-weight="600" fill="#17201d">3. Lọc an toàn</text>
        <text x="66" y="530" font-size="12" fill="#17201d">bỏ các phương án có thể tích dự báo vượt 100.000 lít</text>
        <line x1="310" y1="544" x2="310" y2="583" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>
        <text x="322" y="568" font-size="11" fill="#5a6762">các phương án an toàn</text>

        <!-- 4 -->
        <rect x="50" y="586" width="520" height="76" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#0d6c62"/>
        <text x="66" y="610" font-size="13.5" font-weight="600" fill="#17201d">4. Chọn khuyến nghị</text>
        <text x="66" y="630" font-size="12" fill="#17201d">phương án có lợi ích dự báo cao nhất so với giữ nguyên công thức;</text>
        <text x="66" y="648" font-size="12" fill="#17201d">nếu không phương án nào có lợi ích thì giữ nguyên công thức</text>
        <line x1="310" y1="662" x2="310" y2="701" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>
        <text x="322" y="686" font-size="11" fill="#5a6762">hành động được chọn</text>

        <!-- 5 -->
        <rect x="50" y="704" width="520" height="76" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#0d6c62"/>
        <text x="66" y="728" font-size="13.5" font-weight="600" fill="#17201d">5. Giải thích khuyến nghị</text>
        <text x="66" y="748" font-size="12" fill="#17201d">giá trị Shapley đối chiếu với công thức: chia lợi ích dự báo (kg)</text>
        <text x="66" y="766" font-size="12" fill="#17201d">cho từng biến được thay đổi; tổng các phần bằng lợi ích dự báo</text>
        <line x1="310" y1="780" x2="310" y2="825" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>
        <text x="322" y="807" font-size="11" fill="#5a6762">kg đóng góp của từng biến</text>

        <!-- output -->
        <rect x="50" y="828" width="520" height="124" rx="10" fill="#0d6c62" stroke-width="1.4" stroke="#0d6c62"/>
        <text x="66" y="856" font-size="13.5" font-weight="600" fill="#ffffff">Đầu ra cho người vận hành</text>
        <text x="66" y="882" font-size="12" fill="#ffffff">• hành động khuyến nghị và lợi ích dự báo (kg)</text>
        <text x="66" y="902" font-size="12" fill="#ffffff">• lời giải thích: kg đóng góp của từng biến</text>
        <text x="66" y="922" font-size="12" fill="#ffffff">• mức tin cậy của lời giải thích, lấy từ bước kiểm định</text>
        <line x1="310" y1="952" x2="310" y2="991" stroke="#5a6762" stroke-width="1.4" fill="none" marker-end="url(#mk-muted)"/>

        <!-- human step -->
        <rect x="50" y="994" width="520" height="52" rx="26" fill="#ffffff" stroke-width="1.4" stroke="#c6cfcb"/>
        <text x="310" y="1025" font-size="12" fill="#17201d" text-anchor="middle">Người vận hành duyệt và áp dụng vào bình lên men</text>

        <!-- feedback loop -->
        <path d="M50,1020 H24 V143 H47" stroke="#0d6c62" stroke-width="1.6" fill="none" marker-end="url(#mk-op)"/>
        <text x="14" y="600" font-size="11" fill="#5a6762" text-anchor="middle" transform="rotate(-90 14 600)">trạng thái mới của mẻ, 24 giờ sau</text>

        <!-- build lane -->
        <rect x="670" y="76" width="320" height="124" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#985912"/>
        <text x="686" y="100" font-size="13.5" font-weight="600" fill="#17201d">Bản sao số của quá trình</text>
        <text x="686" y="118" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5a6762">IndPenSim · JAX · bộ xử lý đồ họa</text>
        <text x="686" y="142" font-size="12" fill="#17201d">mô phỏng hàng trăm mẻ cùng lúc</text>
        <text x="686" y="160" font-size="12" fill="#17201d">có bộ điều khiển mức chống tràn bình</text>
        <text x="686" y="178" font-size="12" fill="#17201d">đã kiểm chứng: trùng khớp bản gốc</text>
        <line x1="830" y1="200" x2="830" y2="237" stroke="#985912" stroke-width="1.4" fill="none" marker-end="url(#mk-bd)"/>
        <text x="842" y="224" font-size="11" fill="#5a6762">sinh dữ liệu</text>

        <rect x="670" y="240" width="320" height="66" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#985912"/>
        <text x="686" y="264" font-size="13.5" font-weight="600" fill="#17201d">Dữ liệu hành động ngẫu nhiên</text>
        <text x="686" y="286" font-size="12" fill="#17201d">240 mẻ huấn luyện · 8.640 dòng</text>
        <line x1="830" y1="306" x2="830" y2="345" stroke="#985912" stroke-width="1.4" fill="none" marker-end="url(#mk-bd)"/>
        <text x="842" y="331" font-size="11" fill="#5a6762">huấn luyện</text>

        <rect x="670" y="348" width="320" height="94" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#985912"/>
        <text x="686" y="372" font-size="13.5" font-weight="600" fill="#17201d">Huấn luyện mô hình dự báo</text>
        <text x="686" y="394" font-size="12" fill="#17201d">LightGBM, hai mô hình cho 24 giờ tới:</text>
        <text x="686" y="412" font-size="12" fill="#17201d">penicillin thu thêm; thể tích lớn nhất</text>

        <!-- handover: trained models -->
        <line x1="670" y1="395" x2="573" y2="395" stroke="#985912" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#mk-bd)"/>
        <text x="620" y="385" font-size="11" fill="#5a6762" text-anchor="middle">mô hình</text>
        <text x="620" y="413" font-size="11" fill="#5a6762" text-anchor="middle">đã huấn luyện</text>

        <!-- augmentation loop -->
        <line x1="770" y1="442" x2="770" y2="497" stroke="#985912" stroke-width="1.4" fill="none" marker-end="url(#mk-bd)"/>
        <text x="762" y="474" font-size="11" fill="#5a6762" text-anchor="end">thử khuyến nghị</text>
        <line x1="890" y1="500" x2="890" y2="445" stroke="#985912" stroke-width="1.4" fill="none" marker-end="url(#mk-bd)"/>
        <text x="898" y="474" font-size="11" fill="#5a6762">huấn luyện lại</text>

        <rect x="670" y="500" width="320" height="96" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#985912"/>
        <text x="686" y="524" font-size="13.5" font-weight="600" fill="#17201d">Thu thập dữ liệu có chủ đích</text>
        <text x="686" y="546" font-size="12" fill="#17201d">chạy hệ thống trên mẻ huấn luyện, mô phỏng</text>
        <text x="686" y="564" font-size="12" fill="#17201d">16 tổ hợp quanh mỗi khuyến nghị</text>
        <text x="686" y="584" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5a6762">2 vòng · 46.080 dòng</text>
        <line x1="830" y1="596" x2="830" y2="713" stroke="#985912" stroke-width="1.4" fill="none" marker-end="url(#mk-bd)"/>
        <text x="842" y="660" font-size="11" fill="#5a6762">mô hình cuối cùng</text>

        <rect x="670" y="716" width="320" height="120" rx="8" fill="#ffffff" stroke-width="1.4" stroke="#985912"/>
        <text x="686" y="740" font-size="13.5" font-weight="600" fill="#17201d">Kiểm định lời giải thích</text>
        <text x="686" y="762" font-size="12" fill="#17201d">48 mẻ kiểm thử, tách riêng hoàn toàn</text>
        <text x="686" y="780" font-size="12" fill="#17201d">so với giá trị Shapley tính bằng mô phỏng</text>
        <text x="686" y="798" font-size="12" fill="#17201d">16 nhánh × 24 giờ cho mỗi khuyến nghị</text>
        <text x="686" y="822" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5a6762">đúng yếu tố chính 93% · sai số 22,4 kg</text>

        <!-- rail from the digital twin: branch simulations -->
        <path d="M990,138 H1008 V776 H993" stroke="#985912" stroke-width="1.4" fill="none" marker-end="url(#mk-bd)"/>
        <path d="M1008,548 H993" stroke="#985912" stroke-width="1.4" fill="none" marker-end="url(#mk-bd)"/>
        <text x="1021" y="440" font-size="11" fill="#5a6762" text-anchor="middle" transform="rotate(-90 1021 440)">mô phỏng các nhánh hành động</text>

        <!-- handover: confidence -->
        <path d="M830,836 V905 H573" stroke="#985912" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#mk-bd)"/>
        <text x="700" y="897" font-size="11" fill="#5a6762" text-anchor="middle">mức tin cậy của lời giải thích</text>
      </svg>
